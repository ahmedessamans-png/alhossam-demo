<style>
/* Layout: mobile-first single column, stacked bands, sticky header, floating WhatsApp button */
:root{
  --ink:#0f1a2b; --ink2:#18263d; --gold:#b8924a; --gold2:#d9bb7c;
  --paper:#f6f4ef; --card:#ffffff; --fg:#1c2433; --muted:#5d6676; --line:#e3ddd0;
  --display:"Reem Kufi","Cormorant Garamond",Georgia,serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0c1422;--card:#132036;--fg:#ece7dc;--muted:#a7afbd;--line:#25344d;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0c1422;--card:#132036;--fg:#ece7dc;--muted:#a7afbd;--line:#25344d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75}
html[lang="en"] body{--display:"Cormorant Garamond",Georgia,serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
a{color:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:4px;font-weight:600;text-decoration:none;border:1px solid var(--gold);cursor:pointer;font:inherit;font-weight:600}
.btn-gold{background:var(--gold);color:#101826}
.btn-ghost{background:transparent;color:#f3ead7}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#f3ead7;border-bottom:1px solid #2a3a55}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font-family:var(--display);font-size:1.05rem;display:block;line-height:1.2}
.brand small{color:var(--gold2);font-size:.72rem;letter-spacing:.04em}
.lang{background:none;border:1px solid #3b4d6c;color:#f3ead7;padding:6px 12px;border-radius:4px;font:inherit;font-size:.85rem;cursor:pointer}

.hero{background:radial-gradient(120% 90% at 80% 0%,#22365a 0%,var(--ink) 60%);color:#f3ead7;position:relative;overflow:hidden}
.hero .wrap{padding-block:56px 64px;display:grid;gap:22px;position:relative}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:320px;height:320px;border:1px solid rgba(217,187,124,.18);border-radius:50%}
.eyebrow{color:var(--gold2);font-size:.82rem;letter-spacing:.08em;font-weight:600}
.hero h1{font-size:clamp(2rem,6.5vw,3.4rem);max-width:18ch}
.hero h1 em{font-style:normal;color:var(--gold2)}
.hero p{max-width:52ch;color:#cfd5df;margin:0}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px}
.trust{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.85rem;color:#b9c1cf}
.trust span::before{content:"✓ ";color:var(--gold2)}

section{padding-block:64px}
.head{display:grid;gap:8px;margin-bottom:28px;max-width:60ch}
.head h2{font-size:clamp(1.6rem,4.5vw,2.3rem)}
.head p{color:var(--muted);margin:0}
.rule{width:48px;height:2px;background:var(--gold)}

.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.area{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;gap:8px;align-content:start}
.area svg{width:34px;height:34px;color:var(--gold)}
.area h3{font-size:1.15rem}
.area p{margin:0;color:var(--muted);font-size:.93rem}

.stats{background:var(--ink);color:#f3ead7}
.stats .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px;text-align:center}
.stat b{font-family:"Cormorant Garamond",serif;font-size:2.6rem;color:var(--gold2);display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.9rem;color:#c3cad6}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;counter-reset:s}
.step{border-top:2px solid var(--gold);padding-top:14px}
.step::before{counter-increment:s;content:counter(s);font-family:"Cormorant Garamond",serif;font-size:1.8rem;color:var(--gold)}
.step h3{font-size:1.1rem}
.step p{margin:4px 0 0;color:var(--muted);font-size:.93rem}

.book{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
form{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;gap:14px}
label{font-size:.85rem;font-weight:600;display:grid;gap:6px}
input,select,textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--fg);width:100%}
textarea{min-height:90px;resize:vertical}
.contact{display:grid;gap:14px}
.contact div{display:grid;gap:2px}
.contact small{color:var(--muted)}
.contact b{direction:ltr;unicode-bidi:isolate}
.note{font-size:.82rem;color:var(--muted);margin:0}

details{border-bottom:1px solid var(--line);padding-block:14px}
summary{cursor:pointer;font-weight:600}
details p{color:var(--muted);margin:8px 0 0}

footer{background:var(--ink);color:#b9c1cf;font-size:.85rem}
footer .wrap{padding-block:28px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.sdg{display:inline-flex;align-items:center;gap:8px}
.sdg i{background:#00689d;color:#fff;font-style:normal;font-weight:700;font-size:.75rem;padding:3px 7px;border-radius:3px}
.credit a{color:var(--gold2);text-decoration:none}

.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:calc(18px + env(safe-area-inset-right,0px));width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:30}
.fab svg{width:28px;height:28px;fill:#fff}
@media (prefers-reduced-motion:no-preference){.hero h1,.hero p,.hero .ctas{animation:rise .7s ease both}.hero p{animation-delay:.1s}.hero .ctas{animation-delay:.2s}}
@keyframes rise{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}

.hero .wrap{grid-template-columns:1fr}
@media(min-width:860px){.hero .wrap{grid-template-columns:1.2fr .8fr;align-items:center}}
.hero .art{display:grid;place-items:center}
.hero .art svg{width:min(360px,80vw);height:auto;filter:drop-shadow(0 20px 40px rgba(0,0,0,.4))}
.hero{background-image:radial-gradient(120% 90% at 80% 0%,#22365a 0%,var(--ink) 60%),repeating-linear-gradient(45deg,transparent 0 22px,rgba(217,187,124,.04) 22px 23px);background-blend-mode:normal}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:28px}
.pill{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:6px;overflow:hidden;display:flex;align-items:flex-end;padding:16px;color:#f3ead7;font-family:var(--display);font-size:1.15rem}
.pill::before{content:"";position:absolute;inset:0;background:var(--g)}
.pill svg{position:absolute;inset-inline-end:14px;top:14px;width:64px;height:64px;color:rgba(217,187,124,.55)}
.pill span{position:relative}
.area{transition:transform .2s,border-color .2s}.area:hover{transform:translateY(-3px);border-color:var(--gold)}

.photo{margin:0;position:relative;width:min(380px,82vw);max-width:100%;aspect-ratio:645/799;border-radius:6px;overflow:hidden;background:#1a2740;box-shadow:0 24px 60px rgba(0,0,0,.45);outline:1px solid rgba(217,187,124,.5);outline-offset:10px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.court{position:relative;min-height:340px;display:flex;align-items:flex-end;color:#f3ead7;background:#1a2740 center/cover no-repeat}
.court::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,26,43,.92) 10%,rgba(15,26,43,.15) 75%)}
.court .wrap{position:relative;padding-block:40px;width:100%}
.court h2{font-size:clamp(1.5rem,4.5vw,2.3rem);max-width:22ch}
.court p{color:#cfd5df;margin:8px 0 0;max-width:52ch}
</style>

  document.getElementById("areas").innerHTML=d.areas.map((a,i)=>`<div class="area"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">${icons[i]}</svg><h3>${a[0]}</h3><p>${a[1]}</p></div>`).join("");
  document.getElementById("a").innerHTML=d.areas.map(a=>`<option>${a[0]}</option>`).join("");
  document.getElementById("faq").innerHTML=d.faq.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join("");
  document.querySelectorAll(".wa").forEach(a=>a.href=waLink(L==="ar"?"السلام عليكم، أريد حجز استشارة":"Hello, I would like to book a consultation"));
  document.title=d.name;
}
document.getElementById("lang").onclick=()=>{L=L==="ar"?"en":"ar";render()};
document.getElementById("f").addEventListener("submit",e=>{
  e.preventDefault();
  const n=document.getElementById("n").value,p=document.getElementById("p").value,a=document.getElementById("a").value,m=document.getElementById("m").value;
  const t=L==="ar"?`حجز استشارة\nالاسم: ${n}\nالهاتف: ${p}\nنوع القضية: ${a}\n${m}`:`Consultation request\nName: ${n}\nPhone: ${p}\nCase type: ${a}\n${m}`;
  const link=document.createElement("a");link.href=waLink(t);link.target="_blank";link.rel="noopener";document.body.appendChild(link);link.click();link.remove();
});
render();
fetch("lawyer.txt").then(r=>r.text()).then(t=>{document.getElementById("imgLawyer").src=t.trim()}).catch(()=>{});
fetch("court.txt").then(r=>r.text()).then(t=>{document.getElementById("court").style.backgroundImage="url("+t.trim()+")"}).catch(()=>{});
</script>
